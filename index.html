<script>
/* =========================================================
   TELEGRAM MINI APP
   ========================================================= */
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  try { tg.setHeaderColor('#0f1320'); tg.setBackgroundColor('#0f1320'); } catch (e) {}
}
function haptic(type = 'light') { try { tg?.HapticFeedback?.impactOccurred(type); } catch (e) {} }
function notify(type = 'success') { try { tg?.HapticFeedback?.notificationOccurred(type); } catch (e) {} }

/* =========================================================
   КОНФИГ
   ========================================================= */
const API_URL = 'https://plates-backend-a2he.onrender.com';
const SAVE_KEY = 'plates_game_v4';
const ADMIN_TOKEN_KEY = 'plates_admin_token';

const LETTERS = ['А','В','Е','К','М','Н','О','Р','С','Т','У','Х'];
const REGIONS = ['01','02','03','04','05','07','23','50','77','78','99','177','199','777'];
const TOP_REGIONS  = new Set(['77','99','177','199','777']);
const HIGH_REGIONS = new Set(['78','50']);
const TRIPLE_HI    = new Set(['777','888','999']);
const TRIPLE_MID   = new Set(['111','222','333','444','555','666']);

const LETTER_GROUPS = [
  { name: 'Красная', color: '#ef4444', letters: new Set(['А','В','Е']) },
  { name: 'Зелёная', color: '#22c55e', letters: new Set(['К','М','Н']) },
  { name: 'Синяя',   color: '#3b82f6', letters: new Set(['О','Р','С']) },
  { name: 'Жёлтая',  color: '#eab308', letters: new Set(['Т','У','Х']) },
];
function getLetterGroup(l) { return LETTER_GROUPS.find(g => g.letters.has(l)); }
function isSameSuit(l1, l2a, l2b) {
  const g = getLetterGroup(l1);
  return !!g && g.letters.has(l2a) && g.letters.has(l2b);
}

const RARITIES = {
  common:    { name: 'Обычный',     icon: '⚪', color: '#9ca3af', min: 0 },
  uncommon:  { name: 'Необычный',   icon: '🟢', color: '#4ade80', min: 3000 },
  rare:      { name: 'Редкий',      icon: '🔵', color: '#60a5fa', min: 10000 },
  epic:      { name: 'Эпический',   icon: '🟣', color: '#c084fc', min: 30000 },
  legendary: { name: 'Легендарный', icon: '🟡', color: '#ffd166', min: 80000 },
  mythic:    { name: 'Мифический',  icon: '🔴', color: '#ff6bff', min: 110000 },
};
const GUARANTEE_PRICES = { uncommon: 5000, rare: 15000, epic: 45000, legendary: 90000, mythic: 120000 };
const GUARANTEE_ORDER = ['uncommon','rare','epic','legendary','mythic'];

const EVENT_IDLE_MS = 90000;
const EVENT_ACTIVE_MS = 45000;
const EVENT_FIRST_DELAY_MS = 30000;
const EVENTS = [
  { id: 'discount',    icon: '⚡', name: 'Скидка',          desc: 'Генерация −50%', color: '#22c55e' },
  { id: 'double_sale', icon: '🔥', name: 'Двойные продажи', desc: 'Продажи ×2',     color: '#ef4444' },
  { id: 'value_boost', icon: '💎', name: 'Бонус к цене',    desc: 'Продажа +50%',   color: '#c084fc' },
  { id: 'golden_hour', icon: '🌟', name: 'Золотой час',     desc: 'Эпик+ ×2',       color: '#ffd166' },
];

function getRarity(value) {
  if (value >= RARITIES.mythic.min)    return 'mythic';
  if (value >= RARITIES.legendary.min) return 'legendary';
  if (value >= RARITIES.epic.min)      return 'epic';
  if (value >= RARITIES.rare.min)      return 'rare';
  if (value >= RARITIES.uncommon.min)  return 'uncommon';
  return 'common';
}
const pick = a => a[Math.floor(Math.random() * a.length)];
const randInt = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const formatMoney = n => n.toLocaleString('ru-RU') + ' ₽';

/* =========================================================
   НОВЫЙ РАСЧЁТ ЦЕНЫ (СБАЛАНСИРОВАННЫЙ)
   ========================================================= */
function calculateValue(plate) {
  const details = [];
  let total = 1500; // База снижена

  if (TOP_REGIONS.has(plate.regionCode)) {
    total += 8000;
    details.push({ text: `Регион ${plate.regionCode}`, val: '+8 000 ₽' });
  } else if (HIGH_REGIONS.has(plate.regionCode)) {
    total += 4000;
    details.push({ text: `Регион ${plate.regionCode}`, val: '+4 000 ₽' });
  }

  if (TRIPLE_HI.has(plate.digits)) {
    total += 60000;
    details.push({ text: `Цифры ${plate.digits}`, val: '+60 000 ₽', special: true });
  } else if (TRIPLE_MID.has(plate.digits)) {
    total += 15000;
    details.push({ text: `Цифры ${plate.digits}`, val: '+15 000 ₽' });
  }

  const l1 = plate.l1, l2a = plate.l2[0], l2b = plate.l2[1];
  const allEqual = (l1 === l2a && l2a === l2b);
  const sameSuit = !allEqual && isSameSuit(l1, l2a, l2b);

  if (allEqual) {
    total += 30000;
    details.push({ text: `Буквы одинаковые`, val: '+30 000 ₽', special: true });
  } else if (sameSuit) {
    total += 8000;
    details.push({ text: `🎨 Масть`, val: '+8 000 ₽', special: true });
  } else if (l1 === l2a || l2a === l2b) {
    total += 3000;
    details.push({ text: `Повтор букв`, val: '+3 000 ₽' });
  }

  if (plate.digits[0] === plate.digits[2] && l1 === l2b) {
    total += 25000;
    details.push({ text: `🪞 Зеркалка`, val: '+25 000 ₽', special: true });
  }

  return { value: total, details };
}

function generateRandomPlate() {
  return { l1: pick(LETTERS), digits: String(randInt(1, 999)).padStart(3, '0'), l2: pick(LETTERS) + pick(LETTERS), regionCode: pick(REGIONS) };
}

function buildPlateForRarity(rarity) {
  const minVal = RARITIES[rarity].min;
  let maxVal = Infinity;
  if (rarity === 'uncommon') maxVal = RARITIES.rare.min - 1;
  else if (rarity === 'rare') maxVal = RARITIES.epic.min - 1;
  else if (rarity === 'epic') maxVal = RARITIES.legendary.min - 1;
  else if (rarity === 'legendary') maxVal = RARITIES.mythic.min - 1;
  for (let i = 0; i < 10000; i++) {
    const p = generateRandomPlate();
    const v = calculateValue(p).value;
    if (v >= minVal && v <= maxVal) return p;
  }
  switch (rarity) {
    case 'mythic':    return { l1: 'Х', digits: '777', l2: 'ХХ', regionCode: '777' };
    case 'legendary': return { l1: 'А', digits: '111', l2: 'ВЕ', regionCode: '77' };
    case 'epic':      return { l1: 'А', digits: '111', l2: 'ВМ', regionCode: '77' };
    case 'rare':      return { l1: 'А', digits: '050', l2: 'ВМ', regionCode: '77' };
    case 'uncommon':  return { l1: 'А', digits: '050', l2: 'АК', regionCode: '01' };
    default:          return { l1: 'А', digits: '050', l2: 'ВМ', regionCode: '01' };
  }
}

function renderPlateHTML(plate, size = '', rarity = null) {
  const rc = rarity ? ` rarity-${rarity}` : '';
  return `
    <div class="plate ${size}${rc}">
      <div class="plate-main">
        <span class="slot">${plate.l1}</span>
        <span class="slot">${plate.digits}</span>
        <span class="slot">${plate.l2}</span>
      </div>
      <div class="plate-side">
        <div class="plate-region">${plate.regionCode}</div>
        <div class="plate-flag-block">
          <div class="flag"><div class="flag-w"></div><div class="flag-b"></div><div class="flag-r"></div></div>
          <div class="flag-label">RUS</div>
        </div>
      </div>
    </div>
  `;
}
function renderRarityChip(rarity, isGuaranteed = false) {
  const r = RARITIES[rarity];
  return `<div class="rarity-chip rarity-chip--${rarity}"><span>${isGuaranteed ? '🎯' : r.icon}</span><span>${r.name}${isGuaranteed ? ' · гарантия' : ''}</span></div>`;
}

/* =========================================================
   ЗВУК
   ========================================================= */
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (audioCtx?.state === 'suspended') audioCtx.resume().catch(()=>{});
}
function playTone(freq, duration) {
  if (!settings.sound || !audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.frequency.value = freq;
  g.gain.setValueAtTime(0.05, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + duration);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + duration);
}
function playWinChord(rarity) {
  const chords = { uncommon: [523], rare: [523, 659], epic: [523, 659, 784], legendary: [523, 659, 784, 1047], mythic: [523, 659, 784, 1047, 1319] };
  const notes = chords[rarity];
  if (!notes) return;
  notes.forEach((f, i) => setTimeout(() => playTone(f, 0.22), i * 80));
}

/* =========================================================
   СОСТОЯНИЕ (СТАРТОВЫЙ БАЛАНС 5000)
   ========================================================= */
const settings = { sound: true, flash: true, autoSave: true };
const state = {
  money: 5000, best: null, collection: [],
  lastPlate: null, lastValue: 0, lastDetails: [], lastStatus: 'none',
  lastGuaranteedRarity: null, activeGuarantee: null,
  isGenerating: false, guaranteeOpen: false,
  activeEvent: null, nextEventAt: Date.now() + EVENT_FIRST_DELAY_MS,
  activeBooster: null,
  bonusGuarantees: { uncommon: 0, rare: 0, epic: 0, legendary: 0, mythic: 0 },
  adminAuthorized: false,
  adminToken: localStorage.getItem(ADMIN_TOKEN_KEY) || '',
};

/* =========================================================
   API
   ========================================================= */
async function apiRequest(path, method = 'GET', body = null, useAdmin = false) {
  const headers = { 'Content-Type': 'application/json' };
  if (tg?.initData) headers['x-init-data'] = tg.initData;
  if (useAdmin) headers['x-admin-token'] = state.adminToken;
  const opts = { method, headers };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(API_URL + path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error || 'request_failed');
    err.status = res.status; err.data = data;
    throw err;
  }
  return data;
}

/* =========================================================
   СОХРАНЕНИЕ
   ========================================================= */
function getSaveData() {
  return { money: state.money, best: state.best, collection: state.collection.slice(-50) };
}
async function saveState() {
  if (!settings.autoSave) return;
  if (!tg?.initData) return;
  try { await apiRequest('/save', 'POST', getSaveData()); console.log('✅ Progress saved'); }
  catch (e) { console.warn('❌ Save error:', e.message); }
}
async function loadState() {
  if (!tg?.initData) return false;
  try {
    const data = await apiRequest('/load', 'POST');
    state.money = data.money ?? 5000;
    state.best = data.best ?? null;
    state.collection = Array.isArray(data.collection) ? data.collection : [];
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) {
        const local = JSON.parse(raw);
        if (local.settings) { settings.sound = local.settings.sound ?? true; settings.flash = local.settings.flash ?? true; settings.autoSave = local.settings.autoSave ?? true; }
        state.activeBooster = local.activeBooster ?? null;
        if (state.activeBooster && Date.now() >= state.activeBooster.endsAt) state.activeBooster = null;
        state.bonusGuarantees = local.bonusGuarantees ?? state.bonusGuarantees;
        state.activeGuarantee = local.activeGuarantee ?? null;
      }
    } catch (e) {}
    return true;
  } catch (e) { console.warn('Load error:', e); return false; }
}
function saveLocal() {
  const data = { settings, activeBooster: state.activeBooster, bonusGuarantees: state.bonusGuarantees, activeGuarantee: state.activeGuarantee };
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch (e) {}
}

/* =========================================================
   DOM
   ========================================================= */
const moneyEl = document.getElementById('moneyEl');
const plateArea = document.getElementById('plateArea');
const valueArea = document.getElementById('valueArea');
const actionsArea = document.getElementById('actionsArea');
const bestBox = document.getElementById('bestBox');
const inventoryScreenList = document.getElementById('inventoryScreenList');
const inventoryBadgeCount = document.getElementById('inventoryBadgeCount');
const flashEl = document.getElementById('flashEl');
const loadToast = document.getElementById('loadToast');
const adminBtn = document.getElementById('adminBtn');

function animateMoney(dir) { moneyEl.classList.remove('up','down'); void moneyEl.offsetWidth; moneyEl.classList.add(dir); setTimeout(() => moneyEl.classList.remove(dir), 500); }
function triggerFlash(rarity) { if (!settings.flash) return; flashEl.style.background = `radial-gradient(circle, ${RARITIES[rarity].color}aa 0%, transparent 70%)`; flashEl.classList.add('show'); setTimeout(() => flashEl.classList.remove('show'), 900); }

let currentTab = 'tabPlates';
function setTab(tabId) {
  currentTab = tabId;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.tab === tabId));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.toggle('active', t.id === tabId));
  if (tg?.BackButton) { if (tabId === 'tabPlates') tg.BackButton.hide(); else tg.BackButton.show(); }
}
document.querySelectorAll('.nav-item').forEach(item => { item.addEventListener('click', () => { haptic('light'); setTab(item.dataset.tab); }); });
if (tg?.BackButton) { tg.BackButton.onClick(() => { haptic('light'); setTab('tabPlates'); }); tg.BackButton.hide(); }

/* =========================================================
   ГЕНЕРАЦИЯ (ДИНАМИЧЕСКАЯ СТОИМОСТЬ)
   ========================================================= */
function getEventDef(id) { return EVENTS.find(e => e.id === id); }

function getGenerateCost(forcedRarity) {
  if (forcedRarity) {
    let cost = GUARANTEE_PRICES[forcedRarity];
    if (state.activeEvent && state.activeEvent.id === 'discount') cost = Math.round(cost / 2);
    return cost;
  }
  
  let baseCost = 3000;
  const bestValue = state.best?.value || 0;
  if (bestValue > 1000000) baseCost += 2000;
  else if (bestValue > 500000) baseCost += 1000;
  else if (bestValue > 200000) baseCost += 500;

  if (state.activeEvent && state.activeEvent.id === 'discount') baseCost = Math.round(baseCost / 2);
  return baseCost;
}

function getBoosterBonus() {
  if (!state.activeBooster) return 1;
  if (Date.now() >= state.activeBooster.endsAt) { state.activeBooster = null; return 1; }
  return state.activeBooster.mult;
}
function getSaleBonusMultiplier(rarity) {
  let mult = 1;
  if (state.activeEvent) {
    const ev = state.activeEvent.id;
    if (ev === 'double_sale') mult = 2;
    else if (ev === 'value_boost') mult = 1.5;
    else if (ev === 'golden_hour' && ['epic','legendary','mythic'].includes(rarity)) mult = 2;
  }
  return mult * getBoosterBonus();
}
function renderEventBanner() {
  const el = document.getElementById('eventBanner');
  if (!el) return;
  const now = Date.now();
  if (state.activeEvent) {
    const ev = getEventDef(state.activeEvent.id);
    if (!ev) return;
    const left = Math.max(0, Math.ceil((state.activeEvent.endsAt - now) / 1000));
    el.className = 'event-banner active';
    el.style.background = ev.color + '25'; el.style.border = `1px solid ${ev.color}90`; el.style.color = ev.color;
    el.innerHTML = `<span class="event-banner-icon">${ev.icon}</span><span class="event-banner-name">${ev.name}<br><span class="event-banner-desc">${ev.desc}</span></span><span class="event-banner-timer">${left}с</span>`;
  } else {
    const left = Math.max(0, Math.ceil((state.nextEventAt - now) / 1000));
    el.className = 'event-banner idle';
    el.style.background = ''; el.style.border = ''; el.style.color = '';
    el.innerHTML = `<span class="event-banner-icon">⏳</span><span class="event-banner-name">Следующее событие</span><span class="event-banner-timer">${left}с</span>`;
  }
}
function renderBoosterIndicator() {
  const el = document.getElementById('boosterIndicator');
  if (!el) return;
  if (getBoosterBonus() > 1 && state.activeBooster) {
    el.classList.add('show');
    const left = Math.max(0, Math.ceil((state.activeBooster.endsAt - Date.now()) / 1000));
    el.innerHTML = `<span>🚀 Бустер продаж ×${state.activeBooster.mult}</span><span class="booster-timer">${left}с</span>`;
  } else { el.classList.remove('show'); }
}
function tickEvents() {
  const now = Date.now();
  if (state.isGenerating) {
    const evT = document.querySelector('.event-banner-timer');
    if (evT) { const target = state.activeEvent ? state.activeEvent.endsAt : state.nextEventAt; evT.textContent = `${Math.max(0, Math.ceil((target - now)/1000))}с`; }
    renderBoosterIndicator(); return;
  }
  let changed = false;
  if (state.activeEvent) { if (now >= state.activeEvent.endsAt) { state.activeEvent = null; state.nextEventAt = now + EVENT_IDLE_MS; changed = true; } }
  else if (now >= state.nextEventAt) {
    const ev = pick(EVENTS);
    state.activeEvent = { id: ev.id, endsAt: now + EVENT_ACTIVE_MS }; changed = true;
    ensureAudio(); playWinChord('rare'); triggerFlash('epic'); notify('success');
  }
  if (changed) render();
  else {
    const evT = document.querySelector('.event-banner-timer');
    if (evT) { const target = state.activeEvent ? state.activeEvent.endsAt : state.nextEventAt; evT.textContent = `${Math.max(0, Math.ceil((target - now)/1000))}с`; }
    renderBoosterIndicator();
  }
}

async function rollAnimation(targetRarity) {
  plateArea.className = 'plate-wrapper';
  const targetLabel = targetRarity ? `<div class="roll-target" style="color:${RARITIES[targetRarity].color}">🎯 Цель: ${RARITIES[targetRarity].name}</div>` : '';
  plateArea.innerHTML = targetLabel + `
    <div class="plate">
      <div class="plate-main"><span class="slot" id="s1">А</span><span class="slot" id="s2">000</span><span class="slot" id="s3">АА</span></div>
      <div class="plate-side"><div class="plate-region" id="s4">77</div><div class="plate-flag-block"><div class="flag"><div class="flag-w"></div><div class="flag-b"></div><div class="flag-r"></div></div><div class="flag-label">RUS</div></div></div>
    </div>
  `;
  const s1 = document.getElementById('s1'); const s2 = document.getElementById('s2'); const s3 = document.getElementById('s3'); const s4 = document.getElementById('s4');
  const start = performance.now();
  while (performance.now() - start < 700) {
    if (s1) s1.textContent = pick(LETTERS);
    if (s2) s2.textContent = String(randInt(1,999)).padStart(3,'0');
    if (s3) s3.textContent = pick(LETTERS) + pick(LETTERS);
    if (s4) s4.textContent = pick(REGIONS);
    playTone(900 + Math.random()*300, 0.03);
    await sleep(50);
  }
}

/* =========================================================
   РЕНДЕР
   ========================================================= */
function renderGuaranteePanel() {
  return `<div class="guarantee-panel"><div class="guarantee-title">Нажмите повторно, чтобы отменить</div>${GUARANTEE_ORDER.map(rarity => {
    const r = RARITIES[rarity]; const basePrice = GUARANTEE_PRICES[rarity]; const price = getGenerateCost(rarity);
    const discounted = price < basePrice; const disabled = state.money < price; const isActive = state.activeGuarantee === rarity; const bonusCount = state.bonusGuarantees[rarity] || 0;
    return `<button class="guarantee-btn ${isActive ? 'active' : ''}" data-rarity="${rarity}" ${disabled ? 'disabled' : ''}><span class="g-icon">${r.icon}</span><span class="g-info"><span class="g-name">${r.name}${bonusCount > 0 ? ` <span style="color:#4ade80;">+${bonusCount}🎁</span>` : ''}</span><span class="g-hint">${isActive ? 'активна' : 'гарантия'}</span></span><span class="g-price">${discounted ? `<s style="opacity:.5">${formatMoney(basePrice)}</s> ` : ''}${formatMoney(price)}</span></button>`;
  }).join('')}</div>`;
}
function render() {
  moneyEl.textContent = formatMoney(state.money);
  renderEventBanner();
  renderBoosterIndicator();

  if (state.lastPlate && state.lastStatus !== 'none') {
    const rarity = getRarity(state.lastValue);
    plateArea.className = 'plate-wrapper' + (state.lastStatus === 'sold' ? ' sold' : '');
    plateArea.innerHTML = `${renderRarityChip(rarity, state.lastGuaranteedRarity === rarity)}${renderPlateHTML(state.lastPlate, '', rarity)}`;
  } else {
    plateArea.className = 'plate-wrapper empty';
    plateArea.innerHTML = '<div class="empty-text">Нажмите «Сгенерировать», чтобы получить номер</div>';
  }

  valueArea.innerHTML = '';
  if (state.lastStatus === 'pending') {
    const rarity = getRarity(state.lastValue);
    valueArea.innerHTML = `<div class="value-reveal"><div class="value-big" style="color:${RARITIES[rarity].color}">${formatMoney(state.lastValue)}</div><div class="value-details">${state.lastDetails.map(d => `<div class="value-detail-row${d.special ? ' special' : ''}"><span>${d.text}</span><span class="plus">${d.val}</span></div>`).join('')}</div></div>`;
  } else if (state.lastStatus === 'sold') {
    const soldVal = state.lastSoldValue ?? state.lastValue; const bonusText = state.lastSoldBonus > 1 ? ` <span style="color:#ffd166">(×${state.lastSoldBonus})</span>` : '';
    valueArea.innerHTML = `<div class="sold-msg">✅ Продано за ${formatMoney(soldVal)}${bonusText}</div>`;
  } else if (state.lastStatus === 'kept') {
    valueArea.innerHTML = `<div class="kept-msg">🎒 В инвентарь</div>`;
  }

  if (state.lastStatus === 'pending') {
    const rarity = getRarity(state.lastValue);
    const bonus = getSaleBonusMultiplier(rarity);
    const effectiveValue = Math.round(state.lastValue * bonus);
    const boosted = bonus > 1;
    const bonusText = boosted ? ` <span style="color:#0a0a0a;background:#ffd166;padding:1px 6px;border-radius:4px;font-size:11px;">×${bonus.toFixed(2).replace(/\.00$/,'')}</span>` : '';
    actionsArea.innerHTML = `<button class="btn btn-sell${boosted ? ' boosted' : ''}" id="sellBtn">💰 Продать за ${formatMoney(effectiveValue)}${bonusText}</button><button class="btn btn-keep" id="keepBtn">🎒 В инвентарь</button>`;
    document.getElementById('sellBtn').onclick = handleSell; document.getElementById('keepBtn').onclick = handleKeep;
  } else {
    const active = state.activeGuarantee; const cost = getGenerateCost(active); const baseCost = active ? GUARANTEE_PRICES[active] : 3000;
    const discounted = cost < baseCost; const open = state.guaranteeOpen;
    let bonusRarity = null;
    for (const r of ['mythic','legendary','epic','rare','uncommon']) { if ((state.bonusGuarantees[r] || 0) > 0) { bonusRarity = r; break; } }
    const hasBonus = !!bonusRarity;
    let genLabel, genCost;
    if (hasBonus) { genLabel = `🎁 Бонус: ${RARITIES[bonusRarity].name} (${state.bonusGuarantees[bonusRarity]} шт.)`; genCost = 'бесплатно'; }
    else if (active) { genLabel = `🎲 Купить (${RARITIES[active].name})${discounted ? ' ⚡' : ''}`; genCost = `${discounted ? `<span class="btn-cost-old">${formatMoney(baseCost)}</span>` : ''}−${formatMoney(cost)}`; }
    else { genLabel = `Сгенерировать${discounted ? ' ⚡' : ''}`; genCost = `${discounted ? `<span class="btn-cost-old">${formatMoney(baseCost)}</span>` : ''}−${formatMoney(cost)}`; }
    actionsArea.innerHTML = `<button class="btn btn-generate${hasBonus ? ' bonus-free' : (discounted ? ' discounted' : '')}" id="generateBtn" ${(!hasBonus && state.money < cost) ? 'disabled' : ''}><span>${genLabel}</span><span class="btn-cost">${genCost}</span></button><button class="btn btn-guarantee ${open ? 'open' : ''}" id="guaranteeToggle"><span>🎲 ${active ? 'Гарант: ' + RARITIES[active].name : 'Выбрать гарантию'}</span></button>${open ? renderGuaranteePanel() : ''}`;
    document.getElementById('generateBtn').onclick = () => handleGenerate(active);
    document.getElementById('guaranteeToggle').onclick = () => { haptic('light'); state.guaranteeOpen = !state.guaranteeOpen; render(); };
    if (open) { actionsArea.querySelectorAll('.guarantee-btn').forEach(btn => { btn.onclick = () => { haptic('light'); const chosen = btn.dataset.rarity; state.activeGuarantee = (state.activeGuarantee === chosen) ? null : chosen; state.guaranteeOpen = false; render(); saveLocal(); }; }); }
  }

  if (state.best) {
    const rarity = getRarity(state.best.value);
    bestBox.innerHTML = `<span class="best-label">🏆 Рекорд</span>${renderPlateHTML(state.best.plate, 'small', rarity)}<span class="best-value">${formatMoney(state.best.value)}</span>`;
  } else bestBox.innerHTML = '';

  inventoryBadgeCount.textContent = `${state.collection.length} шт.`;
  inventoryScreenList.innerHTML = state.collection.map((item, idx) => `<div class="inventory-item">${renderPlateHTML(item.plate, 'small', getRarity(item.value))}<div class="inventory-item-info"><span class="inventory-item-price">${formatMoney(item.value)}</span><div class="inventory-actions"><button class="inv-btn sell" data-sell="${idx}">Продать</button></div></div></div>`).join('') || '<div class="empty-inventory">Инвентарь пуст</div>';
  inventoryScreenList.querySelectorAll('[data-sell]').forEach(b => { b.onclick = () => sellFromInv(Number(b.dataset.sell)); });
}

/* =========================================================
   ДЕЙСТВИЯ
   ========================================================= */
async function handleGenerate(forcedRarity) {
  if (state.isGenerating) return;
  let effectiveRarity = forcedRarity; let usingBonus = false;
  if (!forcedRarity) { for (const r of ['mythic','legendary','epic','rare','uncommon']) { if ((state.bonusGuarantees[r] || 0) > 0) { effectiveRarity = r; usingBonus = true; break; } } }
  const cost = usingBonus ? 0 : getGenerateCost(effectiveRarity);
  if (state.money < cost) { notify('error'); return; }
  ensureAudio(); state.isGenerating = true;
  if (usingBonus) state.bonusGuarantees[effectiveRarity] -= 1; else state.money -= cost;
  state.lastStatus = 'none'; state.lastGuaranteedRarity = effectiveRarity; state.guaranteeOpen = false;
  if (!usingBonus) animateMoney('down');
  render();
  await rollAnimation(effectiveRarity);
  const plate = effectiveRarity ? buildPlateForRarity(effectiveRarity) : generateRandomPlate();
  const { value, details } = calculateValue(plate);
  state.lastPlate = plate; state.lastValue = value; state.lastDetails = details; state.lastStatus = 'pending';
  if (!state.best || value > state.best.value) state.best = { plate, value };
  state.isGenerating = false;
  render(); saveLocal(); saveState();
  const rarity = getRarity(value);
  haptic(['legendary','mythic'].includes(rarity) ? 'heavy' : 'light');
  if (['rare','epic','legendary','mythic'].includes(rarity)) { triggerFlash(rarity); playWinChord(rarity); notify(rarity === 'mythic' || rarity === 'legendary' ? 'success' : 'warning'); }
}
async function handleSell() {
  const rarity = getRarity(state.lastValue); const bonus = getSaleBonusMultiplier(rarity); const finalValue = Math.round(state.lastValue * bonus);
  state.money += finalValue; state.lastSoldValue = finalValue; state.lastSoldBonus = bonus; state.lastStatus = 'sold';
  animateMoney('up'); haptic('medium'); notify('success'); render(); saveLocal(); saveState();
}
async function handleKeep() {
  state.collection.push({ plate: state.lastPlate, value: state.lastValue }); state.lastStatus = 'kept';
  haptic('light'); render(); saveLocal(); saveState();
}
async function sellFromInv(idx) {
  if (!state.collection[idx]) return;
  const item = state.collection[idx]; const rarity = getRarity(item.value); const bonus = getSaleBonusMultiplier(rarity); const finalValue = Math.round(item.value * bonus);
  state.money += finalValue; state.collection.splice(idx, 1);
  animateMoney('up'); haptic('medium'); notify('success'); render(); saveLocal(); saveState();
}

/* =========================================================
   ПРОМОКОДЫ
   ========================================================= */
function showPromoResult(text, ok) {
  const el = document.getElementById('promoResult'); el.style.display = 'block'; el.textContent = text;
  el.style.background = ok ? 'rgba(34,197,94,0.15)' : 'rgba(239,68,68,0.15)';
  el.style.color = ok ? '#4ade80' : '#f87171';
  el.style.border = ok ? '1px solid rgba(34,197,94,0.4)' : '1px solid rgba(239,68,68,0.4)';
}
async function activatePromo() {
  const input = document.getElementById('promoCodeInput'); const code = input.value.trim().toUpperCase();
  if (!code) { showPromoResult('Введи код', false); haptic('heavy'); return; }
  const btn = document.getElementById('promoActivateBtn'); btn.disabled = true; btn.querySelector('span').textContent = '...';
  try {
    const res = await apiRequest('/redeem', 'POST', { code }); const reward = res.reward;
    let resultText = '✅ Получено: ';
    if (reward.type === 'money') { state.money += reward.amount; animateMoney('up'); resultText += `+${formatMoney(reward.amount)}`; }
    else if (reward.type === 'booster') { state.activeBooster = { mult: reward.mult, endsAt: Date.now() + reward.durationMs }; resultText += `×${reward.mult} продажи на ${Math.round(reward.durationMs/60000)} мин`; }
    else if (reward.type === 'guarantee') { state.bonusGuarantees[reward.rarity] = (state.bonusGuarantees[reward.rarity] || 0) + reward.count; resultText += `${reward.count} × ${RARITIES[reward.rarity].name}`; }
    showPromoResult(resultText, true); haptic('heavy'); notify('success'); playWinChord('epic'); triggerFlash('epic');
    render(); saveLocal(); saveState(); setTimeout(() => { input.value = ''; }, 1500);
  } catch (e) {
    const map = { not_found: '❌ Код не найден', already_used: '⚠️ Ты уже использовал этот код', limit_reached: '🚫 Лимит исчерпан', empty_code: 'Введи код' };
    showPromoResult(map[e.message] || ('Ошибка: ' + e.message), false); haptic('heavy'); notify('error');
  } finally { btn.disabled = false; btn.querySelector('span').textContent = '✅ Активировать'; }
}

/* =========================================================
   ЛИДЕРБОРД
   ========================================================= */
async function loadLeaderboard() {
  const listEl = document.getElementById('leaderboardList'); listEl.innerHTML = '<div style="text-align:center; padding:20px; color:#8b94a8;">Загрузка...</div>';
  try {
    const rows = await apiRequest('/leaderboard', 'GET');
    if (!rows.length) { listEl.innerHTML = '<div style="text-align:center; padding:30px; color:#8b94a8;">Пока никого нет.</div>'; return; }
    listEl.innerHTML = rows.map(r => { let cls = ''; if (r.rank === 1) cls = 'gold'; else if (r.rank === 2) cls = 'silver'; else if (r.rank === 3) cls = 'bronze'; return `<div class="lb-row"><span class="lb-rank ${cls}">${r.rank}</span><span class="lb-name">${r.name}</span><span class="lb-value">${formatMoney(r.value)}</span></div>`; }).join('');
  } catch (e) { listEl.innerHTML = `<div style="text-align:center; padding:20px; color:#f87171;">Ошибка загрузки</div>`; }
}

/* =========================================================
   АДМИНКА
   ========================================================= */
const adminModal = document.getElementById('adminModal');
const adminAuthBlock = document.getElementById('adminAuthBlock');
const adminPanelBlock = document.getElementById('adminPanelBlock');
const adminCodeInput = document.getElementById('adminCodeInput');
const adminError = document.getElementById('adminError');

adminBtn.onclick = () => {
  haptic('light'); adminModal.classList.add('open');
  if (state.adminAuthorized) { adminAuthBlock.style.display = 'none'; adminPanelBlock.style.display = 'block'; loadPromoList(); }
  else { adminAuthBlock.style.display = 'block'; adminPanelBlock.style.display = 'none'; adminCodeInput.value = ''; adminError.style.display = 'none'; setTimeout(() => adminCodeInput.focus(), 100); }
};
document.getElementById('adminLoginBtn').onclick = async () => {
  const token = adminCodeInput.value.trim(); if (!token) return;
  state.adminToken = token;
  try {
    await apiRequest('/admin/promo/list', 'GET', null, true);
    state.adminAuthorized = true; localStorage.setItem(ADMIN_TOKEN_KEY, token);
    adminError.style.display = 'none'; adminAuthBlock.style.display = 'none'; adminPanelBlock.style.display = 'block';
    haptic('medium'); notify('success'); loadPromoList();
  } catch (e) { adminError.style.display = 'block'; haptic('heavy'); notify('error'); }
};
adminCodeInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('adminLoginBtn').click(); });

document.querySelectorAll('[data-admin-tab]').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('[data-admin-tab]').forEach(t => t.classList.remove('active')); tab.classList.add('active');
    document.querySelectorAll('.admin-tab-content').forEach(c => c.style.display = 'none');
    document.getElementById('adminTab' + tab.dataset.adminTab.charAt(0).toUpperCase() + tab.dataset.adminTab.slice(1)).style.display = 'block';
  };
});

document.getElementById('createPromoBtn').onclick = async () => {
  const code = document.getElementById('newPromoCode').value.trim().toUpperCase();
  const type = document.getElementById('newPromoType').value;
  const amount = Number(document.getElementById('newPromoAmount').value);
  const maxUses = Number(document.getElementById('newPromoMax').value);
  if (!code || !amount || !maxUses) { alert('Заполни все поля'); return; }
  let reward;
  if (type === 'money') reward = { type: 'money', amount };
  else if (type === 'booster') reward = { type: 'booster', mult: 2, durationMs: 5 * 60 * 1000 };
  else if (type === 'guarantee') reward = { type: 'guarantee', rarity: 'epic', count: 1 };
  try {
    await apiRequest('/admin/promo/create', 'POST', { code, reward, maxUses }, true);
    haptic('medium'); notify('success'); document.getElementById('newPromoCode').value = ''; loadPromoList();
  } catch (e) { if (e.message === 'code_exists') alert('Код уже существует'); else alert('Ошибка: ' + e.message); }
};

async function loadPromoList() {
  const listEl = document.getElementById('promoList');
  try {
    const rows = await apiRequest('/admin/promo/list', 'GET', null, true);
    if (!rows.length) { listEl.innerHTML = '<div style="text-align:center; padding:10px; color:#8b94a8;">Нет кодов</div>'; return; }
    listEl.innerHTML = rows.map(r => {
      let label = '';
      if (r.reward.type === 'money') label = `💰 +${formatMoney(r.reward.amount)}`;
      else if (r.reward.type === 'booster') label = `🚀 ×${r.reward.mult} на ${Math.round(r.reward.durationMs/60000)}м`;
      else if (r.reward.type === 'guarantee') label = `🎯 ${RARITIES[r.reward.rarity].name} ×${r.reward.count}`;
      return `<div class="promo-row"><div style="flex:1;"><div class="promo-row-code">${r.code}</div><div class="promo-row-meta">${label} · ${r.usedCount}/${r.maxUses}</div></div><button class="promo-row-del" data-del="${r.code}">✕</button></div>`;
    }).join('');
    listEl.querySelectorAll('[data-del]').forEach(b => { b.onclick = async () => { if (!confirm('Удалить ' + b.dataset.del + '?')) return; try { await apiRequest('/admin/promo/' + b.dataset.del, 'DELETE', null, true); loadPromoList(); } catch (e) { alert('Ошибка'); } }; });
  } catch (e) { listEl.innerHTML = '<div style="color:#f87171; font-size:11px;">Ошибка загрузки</div>'; }
}

document.querySelectorAll('[data-spawn]').forEach(btn => {
  btn.addEventListener('click', () => {
    const rarity = btn.dataset.spawn; const plate = buildPlateForRarity(rarity); const { value, details } = calculateValue(plate);
    state.lastPlate = plate; state.lastValue = value; state.lastDetails = details; state.lastStatus = 'pending'; state.lastGuaranteedRarity = rarity;
    if (!state.best || value > state.best.value) state.best = { plate, value };
    adminModal.classList.remove('open'); render(); saveLocal(); haptic('medium');
    if (rarity !== 'common') { triggerFlash(rarity); playWinChord(rarity); }
  });
});
document.getElementById('adminAdd100k').onclick = () => { state.money += 100000; animateMoney('up'); haptic('medium'); render(); saveState(); };
document.getElementById('adminAdd1m').onclick = () => { state.money += 1000000; animateMoney('up'); haptic('medium'); render(); saveState(); };

/* =========================================================
   МОДАЛКИ / НАСТРОЙКИ / ЗАПУСК
   ========================================================= */
document.querySelectorAll('[data-close]').forEach(btn => { btn.onclick = () => { haptic('light'); document.getElementById(btn.dataset.close).classList.remove('open'); }; });
document.querySelectorAll('.modal-overlay').forEach(m => { m.addEventListener('click', (e) => { if (e.target === m) m.classList.remove('open'); }); });

const soundToggle = document.getElementById('settingSound'); const flashToggle = document.getElementById('settingFlash'); const autoSaveToggle = document.getElementById('settingAutoSave');
soundToggle.addEventListener('change', e => { settings.sound = e.target.checked; if (settings.sound) { ensureAudio(); playTone(800, 0.08); } saveLocal(); });
flashToggle.addEventListener('change', e => { settings.flash = e.target.checked; if (settings.flash) triggerFlash('uncommon'); saveLocal(); });
autoSaveToggle.addEventListener('change', e => { settings.autoSave = e.target.checked; saveLocal(); });

document.getElementById('openSettingsBtn').onclick = () => document.getElementById('settingsModal').classList.add('open');
document.getElementById('openSuitsBtn').onclick = () => document.getElementById('suitsModal').classList.add('open');
document.getElementById('openPromoBtn').onclick = () => { haptic('light'); document.getElementById('promoModal').classList.add('open'); document.getElementById('promoResult').style.display = 'none'; document.getElementById('promoCodeInput').value = ''; setTimeout(() => document.getElementById('promoCodeInput').focus(), 150); };
document.getElementById('openLeaderboardBtn').onclick = () => { haptic('light'); document.getElementById('leaderboardModal').classList.add('open'); loadLeaderboard(); };
document.getElementById('promoActivateBtn').onclick = activatePromo;
document.getElementById('promoCodeInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') activatePromo(); });
document.getElementById('promoCodeInput').addEventListener('input', (e) => { e.target.value = e.target.value.toUpperCase(); });

document.getElementById('modalResetBtn').onclick = () => { if (confirm('Сбросить прогресс?')) { localStorage.clear(); location.reload(); } };

(async function init() {
  const loaded = await loadState();
  if (loaded) { loadToast.classList.add('show'); setTimeout(() => loadToast.classList.remove('show'), 2000); }
  soundToggle.checked = settings.sound; flashToggle.checked = settings.flash; autoSaveToggle.checked = settings.autoSave;
  render();
  setInterval(tickEvents, 250);
  setInterval(() => { if (settings.autoSave) saveState(); }, 20000);
  window.addEventListener('pagehide', saveState);
  window.addEventListener('beforeunload', saveState);
})();
</script>
</body>
</html>
